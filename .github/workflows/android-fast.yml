name: Fast Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Fast Build APK
      run: ./gradlew assembleDebug --no-daemon --build-cache --parallel --offline

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PersianLiveTV-Fast-APK
        path: app/build/outputs/apk/debug/app-debug.apk
