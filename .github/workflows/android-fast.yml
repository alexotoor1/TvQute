name: Fast Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: temurin

    - name: Gradle Cache
      uses: gradle/gradle-build-action@v3

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Fast Build Debug APK
      run: ./gradlew :app:assembleDebug --parallel --configure-on-demand --stacktrace

    # ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ
    # مرحله ۱: چک مسیر استاندارد
    # ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ
    - name: Show outputs (standard paths)
      run: |
        echo "== Standard APK Paths =="
        ls -R app/build/outputs || echo "Standard outputs not found"

    # ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ
    # مرحله ۲: جستجوی هوشمند تمامی APK ها (از هر مسیر)
    # ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ
    - name: Find all APK files recursively
      run: |
        echo "== Searching for APK files =="
        find . -type f -name "*.apk" -print | tee apk_paths.txt
        echo "== END OF LIST =="

    # ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ
    # مرحله ۳: آپلود همه APK هایی که پیدا شد
    # ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ
    - name: Upload ALL APKs
      uses: actions/upload-artifact@v4
      with:
        name: All-Found-APKs
        path: |
          app/build/outputs/**/*.apk
          **/*.apk
